services:
  zinger:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: zinger-launcher
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - OPENBID_PATH=/tmp/openbid
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SITE_URL=https://zinger.kierkegaard.space
    volumes:
      - zinger_data:/app/data

volumes:
  zinger_data:
